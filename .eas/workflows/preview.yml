# On every push to main: checks the code first, then publishes an OTA update
# when a compatible preview build exists (same native fingerprint), or makes a
# new build otherwise. Nothing ships if the checks fail.
name: Preview no celular

on:
  push:
    branches: ['main']

jobs:
  checks:
    name: Lint, typecheck, testes e variáveis
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      # Variables of the preview environment on expo.dev: a missing key would
      # only fail when used, on the phone.
      - name: Variáveis de ambiente
        run: npm run check-env
      - name: Lint
        run: npm run lint
      - name: Typecheck
        # expo-env.d.ts is git-ignored (Expo writes it on start); tsconfig.json includes it.
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npm run typecheck
      - name: Testes
        run: npm test -- --ci

  fingerprint:
    name: Fingerprint
    needs: [checks]
    type: fingerprint
    environment: preview

  get_android_build:
    name: Procurar build compatível
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview

  build_android:
    name: Novo build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  update_android:
    name: Publicar atualização OTA
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: preview
      platform: android
